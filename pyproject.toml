[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lingbot-arms-rs"
version = "0.1.0"
description = "LingBot-VLA inference and control for Seeed Studio reBot B601-RS robotic arms"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6"]

[project.optional-dependencies]
camera = ["opencv-python>=4.8"]
test = ["pytest>=8"]

[project.scripts]
rs-lingbot = "rs_lingbot.cli:main"
rs-lingbot-server = "rs_lingbot.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
